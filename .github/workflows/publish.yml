name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Before Test: integration/cluster.test.ts forks real workers from dist/.
      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm test

      - name: Publish packages
        run: |
          # Versions are bumped manually before pushing to main — this step
          # never writes back to git (main is a protected/locked branch, so a
          # push from CI can't land anyway). If a version is already on npm,
          # fail loudly instead of silently bumping past what was intended.
          for pkg in packages/*/; do
            PKG_JSON="./$pkg/package.json"
            [ -f "$PKG_JSON" ] || continue

            IS_PRIVATE=$(node -p "require('$PKG_JSON').private ?? false")
            [ "$IS_PRIVATE" = "true" ] && continue

            PKG_NAME=$(node -p "require('$PKG_JSON').name")
            LOCAL_VER=$(node -p "require('$PKG_JSON').version")
            PUBLISHED=$(npm show "$PKG_NAME@$LOCAL_VER" version 2>/dev/null || echo "")

            if [ -n "$PUBLISHED" ]; then
              echo "✗ $PKG_NAME@$LOCAL_VER is already published. Bump the version before pushing to main."
              exit 1
            fi

            echo "→ Publishing $PKG_NAME@$LOCAL_VER"
            npm publish "./$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
